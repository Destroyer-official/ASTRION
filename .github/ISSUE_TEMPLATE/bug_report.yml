name: "Bug Report"
description: "File a software defect, UI anomaly, or unexpected behavior."
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form with sufficient detail to reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the defect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explicit sequence of actions to reproduce the behavior.
      placeholder: |
        1. Open application in browser
        2. Select '...'
        3. Scroll mouse wheel over '...'
        4. See anomaly
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened under expected operation.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS Environment
      description: What operating system and browser version were you using?
      placeholder: "e.g. Chrome 130 on Windows 11"
    validations:
      required: false
