<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP (defense-in-depth, closes the SECURITY.md posture gap):
      default-src 'none' as a backstop; script/style keep 'unsafe-inline' only
      because the Vite dev server injects inline bootstrap scripts and the
      panel renders inline styles. connect-src allows same-origin, the one
      user-initiated JPL Horizons call, and localhost WebSockets for dev HMR.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'self'; form-action 'none'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://ssd.jpl.nasa.gov ws://localhost:* http://localhost:*"
    />
    <meta
      name="description"
      content="ASTRION: Flight-grade astrodynamics and multi-scale universe simulation engine integrating JPL DE440 ephemerides, symplectic and IAS15 N-body integration, post-Newtonian general relativity, galactic NFW dark matter potential, and cosmological scale hierarchy."
    />
    <meta property="og:title" content="ASTRION — Flight-Grade Astrodynamics & Multi-Scale Universe Simulation Engine" />
    <meta property="og:description" content="Relativistic N-body astrodynamics simulation engine and 3D cosmic visualization platform spanning planetary, galactic NFW dark matter, and cosmological FLRW expansion." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/Destroyer-official/ASTRION" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASTRION — Flight-Grade Astrodynamics & Multi-Scale Universe Engine" />
    <meta name="twitter:description" content="Relativistic N-body astrodynamics simulation engine and 3D cosmic visualization platform spanning planetary, galactic NFW dark matter, and cosmological FLRW expansion." />
    <meta name="theme-color" content="#050810" />
    <title>ASTRION — Flight-Grade Astrodynamics & Multi-Scale Universe Simulation Engine</title>
  </head>

  </body>
</html>
